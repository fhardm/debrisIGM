seeding:
  type: conditions
  gridseed: gridseed.nc
  area_file: debrismask.shp
  delay: 50
  frequency: 1
  density: []
  particles_per_cell: 1
  subcell_distribution: center
  random_seed: 19019
  slope_threshold: 45
  thk_threshold: 20
  smb_threshold: -9999
  initial_rockfall: default
  max_runout: 0.5 # relative to initial rockfall distance (0.5 = total of 1.5x initial distance)
  slope_correction: true
tracking:
  Nz: 10
  library: tensorflow
  method: 3d
  aggregate_immobile_particles: true
  moraine_builder: true
  latdiff_beta: 0
  latdiff_mode: unfixed
  print_info: live
smb:
  debris_porosity: 0.3
  type: Anderson2016
  oestrem_D0: 0.065
  h_eff: 0.016
  h_crit: 0.036
  k_debris: 0.03
  cliffs: false
  cliff_smb_enhancement: 1.0
  cliff_prediction:
    model_file: cliff_prediction_models.joblib
    parameters_file: cliff_prediction_parameters.json
    presence_mode: spatial_stochastic
    presence_spatial_correlation: true
    fraction_spatial_correlation: true
    fraction_sum_policy: rescale
    allow_surface_slope_fallback: true
    window_policy: physical
    require_100m_grid: true
    presence_threshold: 0.5
    min_velocity_m_per_year: 1.0
    velocity_smoothing_m: 100.0
    surface_smoothing_m: 150.0
    flowline_step_m: 50.0
    random_seed: 19019
    stress_predictor_source: driving_stress