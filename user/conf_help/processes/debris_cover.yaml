seeding:
  type:
    Type: str
    Description: Type of seeding implementation
  area_file:
    Type: str
    Description: File path to the seeding area shapefile
  delay:
    Type: int
    Units: years
    Description: Delay before seeding starts
  frequency:
    Type: int
    Units: years
    Description: Frequency of seeding
  density:
    Type: list
    Units: mm per year
    Description: Debris input rate, definable per year as a list
  particles_per_cell:
    Type: int
    Description: Number of particles seeded in each eligible grid cell
  subcell_distribution:
    Type: str
    Description: Placement within each cell (center, random, or stratified)
  random_seed:
    Type: int
    Description: Base seed for reproducible random and stratified subcell placement
  slope_threshold:
    Type: float
    Units: degrees
    Description: Minimum slope angle condition for seeding
  thk_threshold:
    Type: float
    Units: m
    Description: Maximum ice thickness condition for seeding
  initial_rockfall:
    Type: str
    Description: Choose initial rockfall scheme
  max_runout:
    Type: float
    Description: Maximum runout distance after initial rockfall (relative to distance travelled by initial rockfall)
  slope_correction:
    Type: bool
    Description: Toggle correction of debris input for surface area variations caused by slope
tracking:
  Nz:
    Type: int
    Description: Number of vertical layers for debris tracking
  library:
    Type: str
    Description: Library for particle tracking (e.g. tensorflow, cuda)
  method:
    Type: str
    Description: Method for tracking debris movement
  aggregate_immobile_particles:
    Type: bool
    Description: Toggle aggregation of immobile off-glacier particles, aggregates particles into 1 particle per pixel
  moraine_builder:
    Type: bool
    Description: Toggle moraine building from off-glacier particles & feedback into bed topography
  latdiff_beta:
    Type: float
    Description: Lateral diffusion coefficient for supraglacial lateral debris transport
  print_info:
    Type: str
    Description: Print information during simulation, either updating live or only at discrete intervals ("live", "discrete", "none")
smb:
  debris_porosity:
    Type: float
    Description: Porosity of the debris layer (fraction of volume that is pore space), 1.0 = all pore space, 0.0 = no pore space; default = 0.3 (from Anderson & Anderson (2016), Nicholson et al. (2018))
  type:
    Type: str
    Description: Type of surface mass balance model (e.g. Anderson2016)
  oestrem_D0:
    Type: float
    Units: m
    Description: Oestrem (1959) characteristic debris thickness D0
  h_eff:
    Type: float
    Units: m
    Description: Compagno (2022) parameter for Oestrem curve
  h_crit:
    Type: float
    Units: m
    Description: Compagno (2022) parameter for Oestrem curve
  k_debris:
    Type: float
    Units: m
    Description: Compagno (2022) parameter for Oestrem curve
  cliffs:
    Type: bool
    Description: Toggle consideration of supraglacial cliffs in the debris model
  cliff_prediction:
    model_file:
      Type: str
      Description: Joblib classifier bundle; selects run015/run016/run039/run041 or the legacy cliff_type_models.joblib, relative to user/code/processes or absolute.
    parameters_file:
      Type: str
      Description: JSON file with calibration, covariance ranges, and fitted category fraction distributions.
    presence_mode:
      Type: str
      Description: spatial_stochastic samples calibrated probabilities with a Gaussian-copula field; independent_stochastic disables presence correlation; threshold uses raw p >= 0.5.
    presence_threshold:
      Type: float
      Description: Probability cutoff used when presence_mode is threshold.
    probability_calibration:
      Type: bool
      Description: Apply the run-015 Platt calibrators. Run039/run041 have no matching calibrators and reject true.
    presence_spatial_correlation:
      Type: bool
      Description: Apply the fitted category-specific spatial covariance to stochastic presence.
    fraction_spatial_correlation:
      Type: bool
      Description: Apply fitted spatial covariance to positive category area-fraction magnitudes.
    fraction_sum_policy:
      Type: str
      Description: rescale category fractions to sum to one, allow sums above one, or error on an overfull cell.
    stress_predictor_source:
      Type: str
      Description: Use state.dStress, IGM driving stress from thickness and slope, or another named state array.
    allow_surface_slope_fallback:
      Type: bool
      Description: Use surface downslope if IGM modeled velocity components are unavailable or too slow.
    min_velocity_m_per_year:
      Type: float
      Description: Minimum smoothed flow speed before tracing falls back to surface slope.
    velocity_smoothing_m:
      Type: float
      Units: m
      Description: Gaussian smoothing length for flow-direction velocity components.
    surface_smoothing_m:
      Type: float
      Units: m
      Description: Gaussian smoothing length for surface elevation used by the direction fallback.
    flowline_step_m:
      Type: float
      Units: m
      Description: Step length used to integrate paths upglacier.
    window_policy:
      Type: str
      Description: physical keeps approximately 300 m and 1100 m context windows at other grid sizes; fixed_cells always uses 3x3 and 11x11.
    require_100m_grid:
      Type: bool
      Description: Require direct array API inputs to be 100 m; the IGM state adapter resamples predictors to 100 m and outputs back to the model grid.
    random_seed:
      Type: int
      Description: Base seed for reproducible stochastic presence and area-fraction fields.